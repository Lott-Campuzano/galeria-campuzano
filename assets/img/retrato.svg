<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img">
  <defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
  </filter>
  <filter id="grainSoft" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
  </filter></defs>
  <rect width="1000" height="1250" fill="#efeae0"/>
  
  <defs>
    <linearGradient id="portraitBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d2c4"/>
      <stop offset="1" stop-color="#b7b0a0"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2925"/>
      <stop offset="1" stop-color="#0f0e0d"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#portraitBg)"/>
  <circle cx="500" cy="430" r="250" fill="#b4452f" opacity=".18"/>
  <path d="M170 1250 C 180 930, 300 760, 500 760 C 700 760, 820 930, 830 1250 Z" fill="url(#figure)"/>
  <ellipse cx="500" cy="480" rx="210" ry="250" fill="url(#figure)"/>
  <path d="M290 430 C 300 250, 700 250, 710 430 C 720 340, 660 180, 500 180 C 340 180, 280 340, 290 430 Z" fill="#171614"/>
  <path d="M380 470 C 420 450, 460 450, 500 465" fill="none" stroke="#b7b0a0" stroke-width="3" opacity=".4"/>
  <text x="60" y="1190" font-family="Helvetica, Arial" font-size="15" letter-spacing="5" fill="#f3eee3" opacity=".8">LOTT CAMPUZANO / ESTUDIO</text>

  <rect width="1000" height="1250" filter="url(#grain)" style="mix-blend-mode:multiply" opacity=".55"/>
</svg>