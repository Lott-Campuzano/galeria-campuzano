<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
  </filter>
  <filter id="grainSoft" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
  </filter></defs>
  <rect width="1200" height="1500" fill="#efeae0"/>
  
  <rect width="1200" height="1500" fill="#e8ddcf"/>
  <defs>
    <radialGradient id="flesh" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#d99a86"/>
      <stop offset=".5" stop-color="#bd6b5b"/>
      <stop offset="1" stop-color="#7c3a34"/>
    </radialGradient>
    <radialGradient id="chalk" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6efe2"/>
      <stop offset="1" stop-color="#e3d6c1"/>
    </radialGradient>
    <filter id="organic"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="48"/></filter>
  </defs>
  <g filter="url(#organic)">
    <path d="M380 380 C 560 270, 790 330, 830 510 C 880 720, 760 930, 610 980 C 440 1030, 300 900, 300 720 C 300 580, 260 450, 380 380 Z" fill="url(#flesh)"/>
    <path d="M650 720 C 780 650, 900 720, 900 850 C 900 980, 740 1040, 640 960 C 540 880, 550 780, 650 720 Z" fill="#a9534a" opacity=".8"/>
    <circle cx="840" cy="300" r="140" fill="url(#chalk)" opacity=".9"/>
  </g>
  <g fill="none" stroke="#6f342f" stroke-width="2" opacity=".45">
    <path d="M420 500 C 520 560, 560 700, 520 840"/>
    <path d="M560 400 C 640 520, 760 640, 820 780"/>
    <path d="M340 760 C 460 740, 600 820, 660 940"/>
  </g>
  <text x="90" y="1370" font-family="Helvetica, Arial" font-size="17" letter-spacing="6" fill="#552a26" opacity=".65">CARNE Y CAL</text>

  <rect width="1200" height="1500" filter="url(#grain)" style="mix-blend-mode:multiply" opacity=".55"/>
</svg>