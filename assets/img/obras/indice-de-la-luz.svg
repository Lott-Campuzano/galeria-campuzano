<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
  </filter>
  <filter id="grainSoft" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
  </filter></defs>
  <rect width="1200" height="1500" fill="#efeae0"/>
  
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f98a6"/>
      <stop offset=".42" stop-color="#c7c6b8"/>
      <stop offset=".68" stop-color="#e6d8bd"/>
      <stop offset="1" stop-color="#8d8171"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8e7" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#f2e0ba" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f2e0ba" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b584f"/>
      <stop offset="1" stop-color="#2d2b27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#sky)"/>
  <circle cx="760" cy="560" r="330" fill="url(#sun)"/>
  <circle cx="760" cy="560" r="74" fill="#fcf4df" opacity=".92"/>
  <g fill="#6f6a5e" opacity=".32">
    <ellipse cx="330" cy="390" rx="260" ry="34"/>
    <ellipse cx="880" cy="300" rx="210" ry="22"/>
    <ellipse cx="600" cy="690" rx="330" ry="24"/>
  </g>
  <path d="M0 1160 C 260 1100, 420 1180, 660 1130 S 1010 1040, 1200 1100 L 1200 1500 L 0 1500 Z" fill="url(#land)"/>
  <path d="M0 1220 C 300 1180, 470 1260, 760 1200 S 1080 1150, 1200 1190" fill="none" stroke="#d9cba9" stroke-width="2" opacity=".35"/>
  <g fill="#f4ead0" opacity=".5">
    <circle cx="180" cy="1310" r="3"/><circle cx="340" cy="1370" r="2"/><circle cx="900" cy="1290" r="3"/><circle cx="1050" cy="1390" r="2"/>
  </g>
  <text x="70" y="1420" font-family="Helvetica, Arial" font-size="16" letter-spacing="6" fill="#efe6d2" opacity=".65">ÍNDICE DE LA LUZ</text>

  <rect width="1200" height="1500" filter="url(#grain)" style="mix-blend-mode:multiply" opacity=".55"/>
</svg>